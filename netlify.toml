# This publishes the fictional demo only. The personal Node server is separate.
[build]
  command = "node build-demo.mjs"
  publish = "public"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
